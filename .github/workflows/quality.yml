name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, tests and coverage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Check formatting with Black
        run: python -m black --check --diff .

      - name: Type-check publication core with MyPy
        run: python -m mypy

      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Build distributable artifacts
        run: python -m build

      - name: Publish coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Publish distribution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: warn
